[package]
name = "tokora"
version = "0.9.1"
edition.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic parser combinators, with on-demand lexing, LALR-style dispatch, explicit backtracking, and configurable diagnostics."
categories = ["parsing", "text-processing", "no-std", "no-std::no-alloc"]
keywords = ["parser", "combinator", "token", "logos", "error-recovery"]

[features]
default = ["std", "combinators"]
alloc = ["generic-arraydeque/alloc", "mayber/alloc", "tinyvec_1?/alloc"]
std = [
  "generic-arraydeque/default",
  "thiserror/default",

  "bytes_1?/default",
  "hipstr_0_8?/default",
  "bstr_1?/default",
  "smol_bytes_0_1?/default",
  "tinyvec_1?/default",

  "logos_0_14?/default",
  "logos_0_15?/default",
  "logos_0_16?/default",
  "mayber/default",
]

logos = ["logos_0_16"]
logos_0_14 = ["dep:logos_0_14"]
logos_0_15 = ["dep:logos_0_15"]
logos_0_16 = ["dep:logos_0_16"]

# --- Combinator families -------------------------------------------------------------------
#
# Every combinator *family* under `src/parser/` is independently gateable, so an embedded or
# no-alloc consumer compiles only the ones it calls. What is NOT gated is the parser substrate:
# `Parser`/`Parse`/`parse*`, the `ParseInput`/`TryParseInput` traits themselves, and the
# top-level `src/parser/*.rs` combinators (`expect`, `delimited`, `recover`, `recovery_gate`,
# `select`, `opt`, `padded`, `node`, `skip_then_retry`, `ignore`, `labelled`, `empty`, `todo`,
# `with`, `by_ref`, `collect`, `accepted`, `unwrapped`). Those are shared infrastructure — the
# families are written against them and the crate's own error/recovery/CST machinery names them
# — so splitting them out would buy a seam that nothing can actually stand on. The two
# exceptions are named on their features below: `list`/`separated1` and `ident_list` are
# `many`'s drivers under another name, so they follow it.
#
# `combinators` is the umbrella and is ON by default, so a plain `tokora = "0.9"` sees exactly
# the 0.8 surface. `default-features = false` consumers opt into the families they use.
#
# ── WHAT THE TEST SUITE GATES ON, AND WHY IT IS THE UMBRELLA ────────────────────────────────
#
# Measured at `ec337c8`: of 106 integration suites, 82 name `combinators` in their crate-level
# `#![cfg(...)]` and NOT ONE names a family there. (Two files name one on an INNER item:
# `tests/common/mod.rs` and `tests/forwarding_discrimination.rs`, both on `pratt`, plus `map`
# in the latter.) The umbrella at the crate level is deliberate, and the reason is worth
# writing down because the obvious repair does not do what it looks like it does.
#
# What is already covered. CI's `cargo hack -p tokora --each-feature --no-deps --tests` runs
# clippy over each of the thirteen families ALONE, so the footprint claim above — a consumer
# naming one family type-checks — is gated on the library, which is the artifact a consumer
# gets. It stops at metadata and never links, so it is a compile claim and not a link one.
#
# What re-gating the 82 would NOT buy. Seventy-nine of them want `std` AND a logos version on
# top of the umbrella; the other three want `rowan`+`std` (2) or `std` alone (1). No
# `--each-feature` leg supplies a family together with the rest of what any of those shapes
# needs — `std` alone has no lexer, `logos` alone has no `std`, `rowan` alone has no family, and
# `default` has `std` and the families but no lexer. So swapping `combinators` for `pratt` in
# `tests/parser_pratt.rs` does not make `--features pratt` compile it; the suite would go on
# cfg-ing itself out, in one more configuration than before. Real per-family test coverage costs
# thirteen further `std,logos,<family> --tests` legs, and that is the price to weigh — not the
# file edits.
#
# Why the umbrella cannot hide a behaviour difference. `tokora/src/` contains NO
# `#[cfg(not(feature = "<family>"))]` guarding code. The 32 negative-family occurrences there
# are all `#[cfg_attr(not(feature = ...), doc = ...)]` — doc text that degrades an intra-doc
# link to plain prose when the family is off. So a single-family build runs the same code the
# umbrella build runs, and the gap is compile coverage of the test tree only.
combinators = [
  "any",
  "fail",
  "filter",
  "fold",
  "ident",
  "keyword",
  "many",
  "map",
  "peek",
  "pratt",
  "punct",
  "then",
  "validate",
]

# `Any` — accept one token of any kind, plus its `spanned`/`sliced`/`located` shapes.
any = []
# `fail` / `fail_with` — a parser that always errors.
fail = []
# `filter`/`filter_with` and `filter_map`/`filter_map_with`. One feature: the two modules are
# the same conceptual family, are the same size, and their `ParseInput` methods sit together.
filter = []
# The `fold` drivers (`fold_while`, `try_fold_while`, `rfold_while`, ...). They reuse `many`'s
# absence-gate error construction (`many::absence_after_element`), so they pull `many` in.
fold = ["many"]
# `Ident::parse` / `try_parse` (+ `_except`) — identifier-token parsers on `types::Ident`.
# `try_ident_list` needs this AND `many`; it is one item and is gated on both.
ident = []
# `Keyword::parse` / `try_parse` (+ `_exact`, `_sliced`) on `types::Keyword`.
keyword = []
# The repetition family: `repeated`, `repeated_while`, `separated*`, `delim*`, the eight
# leading/trailing delimiter handlers, the four cardinality bounds, and the `Vec`-sinking
# `list`/`separated1` shapes built on them (those also keep their `alloc`/`std` gate).
many = []
# `map` / `map_with`.
map = []
# The lookahead family: `peek_then`, `peek_then_choice`, `peek_kind`, `dispatch_on_kind` and
# its fused twin.
peek = []
# Pratt expression parsing: the typed `pratt(...)` driver and the token-level
# `InputRef::pratt*` driver, their `PrattToken` classification vocabulary, the `PrattEmitter`
# capability and the CST kind wiring. `token::PrattToken` and the `InputRef` driver live
# outside `src/parser/`, but they are the same family and are gated with it.
pratt = []
# The punctuator parsers — `Comma::parse`/`try_parse` and the other seventy-five markers — and
# `delimited`'s `parens`/`braces`/`brackets`/`angles` shapes, which run them. NOT the
# `Punctuator` trait impls for those markers: `delimited`, `TypedDelimiter` and every
# `separated_by_*` read them, so they are vocabulary and stay unconditional.
punct = []
# The sequencing family: `then`, `then_ignore`, `ignore_then`, `then_value`, `and_then`,
# `and_then_with`.
then = []
# `validate` / `validate_with`.
validate = []

# Parser tracing. Turns on `traced(name, parser)` — a wrapper that prints an indented
# enter / exit-ok / exit-err / rollback event tree to stderr with an input preview — and
# instruments the crate's own combinators (`try_expect`, `peek`, the `sync` family, the
# transaction guards' begin/commit/rollback, `attempt`/`try_attempt`, and the
# separated/repeated drivers) to emit their name at the current depth. Std-implied (uses
# stderr and thread-locals) and zero extra dependencies. Zero-cost when off: `traced` is the
# identity and every internal hook site is `#[cfg]`'d out of existence, not runtime-guarded.
trace = ["std"]

# Exposes the raw, unstable checkpoint backtracking API — `InputRef::{save, restore, commit}`
# and, with them, the `Checkpoint` type's construction and consumption. Off by default: the
# supported backtracking surface is the transaction guards (`begin`/`begin_stacked`), the
# `InputRef` session points, and `attempt`/`try_attempt`. No dependencies; opting in only
# flips those three methods from crate-internal to public.
unstable-raw = []

# The lexer conformance test kit (`tokora::conformance`): a `Harness` that drives a custom
# `Lexer` against the trait-level lexer contract and, through the input machinery, a set of
# deterministic save/peek/drain/restore schedules. It is a test-time tool, but it needs only
# `alloc`: `assert!` and formatted `panic!` are `core`, and `Vec`/`String` come from `alloc`.
# It required `std` until 2026-08; that forced `std` on for every consumer who enabled it,
# including through `[dev-dependencies]`, where feature unification silently switched the
# whole dependency graph's tokora to `std` and made no-std testing of tokora vacuous.
# Off by default; enabling it only compiles the `conformance` module.
conformance = ["alloc"]

# The public fuzz harness (`tokora::fuzz`): a deterministic operation-script fuzzer that drives
# the input/backtracking machinery (consume, peek, the `sync` family, `attempt`, transaction
# guards, stacked savepoints, session points, partial-mode chunking) against a scriptable
# synthetic lexer and checks the documented laws after every operation. It asserts, owns
# `Vec`/`String`, and drives the allocator-gated guards, so it requires `std` (which provides the
# `alloc` the guards and session stack need). Off by default; enabling it only compiles the
# `fuzz` module, which runs as ordinary `#[test]`s on stable Rust.
fuzz = ["std"]

# The lossless CST tower (`tokora::cst`): the event stream, the recording `Sink`, and the
# materialization of both into a `rowan` green/red tree. Off by default; enabling it compiles 41
# `#[cfg]`-gated code sites, in 6 files under `src/`. Counted on `543ce6d`, and the two figures
# are different questions: `src/` carries 66 mentions of `feature = "rowan"` across 8 files, of
# which those 41 are the gates whose CODE exists only when the feature is on. The other 25 are 14
# `doc(cfg(...))` docs.rs labels, 10 doc-text alternations and one `not(...)` arm.
#
# ── THIS FEATURE IS NOT INTERPRETED BY MIRI, AND THAT IS DELIBERATE ─────────────────────────
#
# The Miri matrices run `--features logos` and `--features logos,unstable-raw`; `rowan` is in
# neither, and not in `default`, so those 41 sites have never been COMPILED under Miri on any
# target under either aliasing model. Zero coverage of the path 0.9.0 ships as its lossless
# story — not reduced coverage.
#
# Enabling it there does not close the gap, it reddens the cells. `rowan 0.17.0`, the version
# `Cargo.lock` resolves, executes undefined behaviour on its ordinary public path, and the two
# models find it at two DIFFERENT sites, so neither is clean and no one-model half-measure
# exists: Stacked Borrows at `arc.rs:264` (`<HeaderSlice<H, [T; 0]> as Deref>::deref` forging a
# whole-slice reference from a header-only retag), reached through `cst::sink::finish::replay`
# from building any tree; Tree Borrows at `cursor.rs:136` (`rowan::cursor::free`), reached from
# dropping any red-tree `SyntaxNode`. Both reproduced on `543ce6d` on 2026-08-07 against 0.16.1
# (then `arc.rs:260` / `cursor.rs:219`), red on the first of `--test parser_node`'s 24 tests
# under each model, and re-measured unchanged against 0.17.0 when this requirement was bumped.
#
# The defect is rowan's: `src/cst` contains no `unsafe` at all. It is unfixed upstream since
# 2021 (rust-analyzer/rowan#108, #163, #192, all open; the one fix attempt, PR #211, is a draft
# whose own description says the immutable path still fails), and the `arc.rs` construct is
# present unchanged in `0.17.0`, the newest release — so RAISING THE REQUIREMENT BELOW IS NOT A
# FIX. The answer flips when a published rowan is clean at both sites under both models; at that
# point add `rowan` to the feature sets in `ci/miri_sb.sh` and `ci/miri_tb.sh`, which carry the
# full account. Recorded for 0.9.0 by al8n/tokit#235.
rowan = ["dep:rowan", "std"]

bytes = ["bytes_1"]
bytes_1 = ["dep:bytes_1"]

bstr = ["bstr_1"]
bstr_1 = ["dep:bstr_1"]

hipstr = ["hipstr_0_8"]
hipstr_0_8 = ["dep:hipstr_0_8"]

smol_bytes = ["smol_bytes_0_1"]
smol_bytes_0_1 = ["dep:smol_bytes_0_1"]

smallvec = ["smallvec_1"]
smallvec_1 = ["dep:smallvec_1", "alloc"]

heapless = ["heapless_0_9"]
heapless_0_9 = ["dep:heapless_0_9"]

tinyvec = ["tinyvec_1"]
tinyvec_1 = ["dep:tinyvec_1"]

[dependencies]
ascii = { version = "1", default-features = false }
deranged = { version = "0.5", default-features = false }
mayber = { version = "0.1", default-features = false }
derive_more = { version = "2", default-features = false, features = [
  "display",
  "deref",
  "deref_mut",
  "as_ref",
  "from",
  "into",
  "unwrap",
  "try_unwrap",
  "is_variant",
] }
generic-arraydeque = { version = "0.2", default-features = false, features = ["unstable"] }
paste = "1"
seq-macro = { version = "0.3", default-features = false }
thiserror = { version = "2", default-features = false }

# Third-party Source Types
bstr_1 = { package = "bstr", version = "1", default-features = false, optional = true }
bytes_1 = { package = "bytes", version = "1", default-features = false, optional = true }
hipstr_0_8 = { package = "hipstr", version = "0.8", default-features = false, optional = true }
smol_bytes_0_1 = { package = "smol-bytes", version = "0.1", default-features = false, optional = true, features = [
  "alloc",
] }

# Third-party Container Types
heapless_0_9 = { package = "heapless", version = "0.9", default-features = false, optional = true }
smallvec_1 = { package = "smallvec", version = "1", default-features = false, optional = true, features = [
  "const_new",
] }
tinyvec_1 = { package = "tinyvec", version = "1", default-features = false, optional = true }

# Third-party Parser/Lexer Tools
logos_0_14 = { package = "logos", version = "0.14", default-features = false, optional = true, features = [
  "export_derive",
] }
logos_0_15 = { package = "logos", version = "0.15", default-features = false, optional = true, features = [
  "export_derive",
] }
logos_0_16 = { package = "logos", version = "0.16", default-features = false, optional = true, features = [
  "export_derive",
] }
# This IS `0.17` now, and it did NOT buy a Miri-clean lossless path — measured on 0.17.0, not
# predicted. Both sites survived the bump and only moved line numbers: Stacked Borrows still reds
# in `arc.rs` (260 -> 264) and Tree Borrows still reds in `cursor::free` (219 -> 136), even though
# 0.17 deleted `sll.rs` and rewrote `cursor.rs` from 1592 lines to 1003. The bump was made because
# `rowan` is in this crate's PUBLIC API and its major is therefore ours — not because it fixes
# anything. See the `rowan` feature's note above for the two sites, the repro and what a real fix
# would look like; raising this requirement again is still not that fix.
rowan = { version = "0.17", optional = true }

# ── NO `criterion` HERE, AND NO `[[bench]]` — BOTH ARE LOAD-BEARING ABSENCES ────────────────
#
# The five benches are `tokora-benches`, a sibling workspace member, and criterion is ITS
# dev-dependency. Cargo resolves dev-dependencies per PACKAGE rather than per target, so a
# `criterion` entry in this table is built for every `--test` target of this crate — including
# under `cargo miri test --target x86_64-apple-darwin --test span`, where its transitive
# `alloca` runs a cc-rs build script that hands the host `cc` an `-arch x86_64
# -mmacosx-version-min=10.7` no Linux `cc` accepts. That one line is why 16 Miri cells had to
# ask for a macOS runner (#216). Cargo has no optional dev-dependency, so the package boundary
# is the mechanism; putting criterion back here would put those cells back on macOS.
[dev-dependencies]
# `CACHE_CALL_CENSUS` (`conformance/cache_tests.rs`) parses `conformance/cache.rs` and walks its
# expression tree, so the census is exact for call SYNTAX rather than for a list of spellings.
# Three review rounds of #183 each patched a substring matcher and each was followed by a new gap
# in it — whitespace around `.`, a turbofish read as a function item — which is a property of text
# scanning, not of any one pattern. `span-locations` is what gives each call a line, so an anchor
# comment binds to the call it annotates rather than to the comment block above it.
#
# These two are subject to the same per-package reach the block above describes, so the reason
# they are admissible where `criterion` is not has to be stated: both are pure Rust. `syn` 2 has
# no build script at all, and `proc-macro2`'s only runs `rustc --version` — neither hands a C
# compiler a target triple it cannot serve, which is the failure that put 16 Miri cells on macOS.
# `default-features = false` keeps the `proc-macro` bridge out: the census runs in a `#[test]`,
# not in a proc macro, so the fallback implementation is the one that is wanted anyway.
proc-macro2 = { version = "1", default-features = false, features = [
  "span-locations",
] }
syn = { version = "3", default-features = false, features = [
  "full",
  "parsing",
  "visit",
] }
tempfile = "3"
trybuild = "1.0.118"

[lints]
workspace = true

# Disable the default libtest bench harness. This crate declares no `[[bench]]` target of its
# own any more, but `bench = false` still matters: without it `cargo bench -p tokora` builds and
# runs the lib under libtest's bench harness, which is not a thing anyone wants to have happen.
[lib]
bench = false

[[example]]
name = "json"
path = "examples/json.rs"
required-features = ["std", "logos", "combinators"]

[[example]]
name = "calculator"
path = "examples/calculator.rs"
required-features = ["std", "logos", "combinators"]

[[example]]
name = "s_expression"
path = "examples/s_expression.rs"
required-features = ["std", "logos", "combinators"]

[[example]]
name = "c_expression"
path = "examples/c_expression.rs"
required-features = ["std", "logos", "combinators"]

# Lossless-CST twins of the four examples above: each parses the same grammar as its twin but
# builds a rowan concrete syntax tree through a `cst::Sink`, so it needs `rowan` as well.
# The error-recovery example: the only in-tree grammar that parses malformed input to
# completion. Needs `rowan` because half of what it demonstrates is the shape of the CST the
# recovery leaves behind (a real, sometimes zero-width, error node).
[[example]]
name = "expr_recovery"
path = "examples/expr_recovery.rs"
required-features = ["std", "logos", "rowan", "combinators"]

[[example]]
name = "calculator_cst"
path = "examples/calculator_cst.rs"
required-features = ["std", "logos", "rowan", "combinators"]

[[example]]
name = "s_expression_cst"
path = "examples/s_expression_cst.rs"
required-features = ["std", "logos", "rowan", "combinators"]

[[example]]
name = "json_cst"
path = "examples/json_cst.rs"
required-features = ["std", "logos", "rowan", "combinators"]

[[example]]
name = "c_expression_cst"
path = "examples/c_expression_cst.rs"
required-features = ["std", "logos", "rowan", "combinators"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = [
  "tokora",
  "tokora-benches",
  "tokora-icount",
]
default-members = ["tokora"]

resolver = "3"

[workspace.package]
rust-version = "1.95"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/al8n/tokora"
homepage = "https://github.com/al8n/tokora"
documentation = "https://docs.rs/tokora"

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

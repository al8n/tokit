name: Miri

# ── THE SLOW LANE ───────────────────────────────────────────────────────────────────────────
#
# Miri lives in its own workflow so that `CI` can reach a CONCLUSION. Measured 2026-08-05 on
# `main` (#213): five consecutive main commits merged with no CI verdict at all — one run sat
# `queued` for 3h02m — while `loc` and `Deploy mdBook` completed on the same refs in the same
# window, so it was never an outage.
#
# The jobs were not the problem; the RUN was. In run 31014181684 (main `680d15f9`) 34 of the 59
# jobs completed within 49m49s of the run being created and 25 did not: the 24 Miri cells and
# `coverage`. A conclusion is a property of the whole run, so all 34 of those verdicts were
# unreadable — and two of them were REAL failures (`feature combinations` on that commit,
# `name-collision-probe` as well on the next one) sitting inside runs whose conclusion stayed
# `null`. A verdict that never arrives is not a slow gate, it is no gate.
#
# WHY MIRI AND NOTHING ELSE. #213 proposed moving the sanitizers and the cross matrix here too.
# The workflow said otherwise: `sanitizer` and `cross` are `ubuntu-latest`, and every one of
# their cells completed in the measured run. When the split was made, the 16 apple-darwin cells
# of the two matrices below were the only macOS-bound cells in the repository — the 269–347
# minute macOS queue #157 measured, and the whole of it — so the line was drawn where the hosts
# were.
#
# THE HOSTS ARE ALL THE SAME NOW, AND THIS FILE STAYS SPLIT ANYWAY. #216 removed the macOS
# requirement: every cell below is `ubuntu-latest`, and the repository has no macOS-bound job
# left in any workflow. That retires the argument the split was originally made on, and NOT the
# split — what makes `CI` unreadable is a run that cannot conclude, and Miri is still the long
# pole by an order of magnitude. Before sharding, one Tree-Borrows cell was 116.9 minutes; the
# whole of `CI` answers in tens of minutes. Folding these 25 cells back in would put that answer
# behind them again for a different reason than last time and with the same result, so the
# contract is unchanged: `CI` is what a merge waits for, `Miri` reports on its own clock.
#
# The SCHEDULING-not-coverage promise the split was made under is also unchanged by #216. Every
# job, matrix cell and step below runs what it ran before: same targets, same shards, same
# `MIRIFLAGS`, same scripts, same 24 cells plus the plan job. Only `runs-on` changed.
#
# ── WHAT THESE 24 CELLS DO NOT COVER, AND WHY IT IS NOT AN OVERSIGHT: `rowan` ───────────────
#
# Every cell below runs `ci/miri_sb.sh` or `ci/miri_tb.sh`, and those run two feature sets —
# `logos` and `logos,unstable-raw`. `rowan` is in neither, and it is not in `default`, so no
# cell in this workflow has ever COMPILED the lossless CST materialization path. Measured on
# `543ce6d`: 66 mentions of `feature = "rowan"` across 8 files under `tokora/src`, of which 41
# are `#[cfg]` gates whose code exists only when the feature is on. Across all three targets and
# both models that is ZERO coverage of that path, not reduced coverage — and it is the path
# 0.9.0 ships as its lossless story, which is why it is written down rather than left to be
# rediscovered.
#
# Adding `rowan` to the matrices, or to the scripts' feature sets, does not close the gap: it
# turns these cells red. `rowan 0.17.0` executes undefined behaviour on its ordinary public
# path, and the two aliasing models find it at two DIFFERENT sites — Stacked Borrows in
# `arc.rs:264`, Tree Borrows in `cursor.rs:136` — so neither model is clean and there is no
# one-model half-measure. Both were reproduced on `543ce6d` on 2026-08-07, red on the first of
# `--test parser_node`'s 24 tests under each model. The defect is rowan's, not tokora's;
# `tokora/src/cst` contains no `unsafe` at all.
#
# What would flip the answer: a published rowan clean at both sites under both models. Upstream
# has had the reports open since 2021 (rust-analyzer/rowan#108, #163, #192) and the only fix
# attempt, PR #211, is a draft whose own description says the immutable path still fails, so
# this is not a wait measured in weeks. The two scripts carry the full account with backtraces
# and the exact repro command — read `ci/miri_sb.sh` before adding a feature here. Recorded for
# 0.9.0 by al8n/tokit#235; the sibling notes are in both scripts, in `tokora/Cargo.toml`'s
# `rowan` feature, and in the changelog's known-limitation entry.

# Triggers, `paths-ignore` and the concurrency rule are deliberately identical to
# `.github/workflows/ci.yml`; read the comments there for why the ignore list carries no blanket
# `**.md` (the guide chapters under `tokora/src/guide/` and `README.md` are `include_str!`'d, so
# they are code here).
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  pull_request:
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"

concurrency:
  # Same expression as `CI`'s, and `${{ github.workflow }}` leading it is what keeps the two
  # lanes independent: `CI-refs/heads/main-<sha>` and `Miri-refs/heads/main-<sha>` are different
  # groups, so neither lane can ever cancel the other's run. The rest is #141 unchanged — one
  # in-flight run per ref, except on `main`, where the group is keyed on the commit SHA so that
  # every main commit gets its own group and its own verdict. Do NOT collapse that back to one
  # group per ref: `cancel-in-progress: false` does not protect a main run on its own, because a
  # run queued into a group that already has one in progress cancels whichever run was PENDING
  # there regardless of that setting — and this workflow is precisely the one whose runs stay
  # pending long enough for the next push to do it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `RUSTFLAGS` is carried over from `CI` verbatim even though `ci/miri_tb.sh` and `ci/miri_sb.sh`
# both `export RUSTFLAGS="--cfg test_$CONFIG_FLAGS"` before any `cargo miri test`: the export
# happens AFTER `cargo miri setup`, so this value is what the sysroot build sees, and dropping it
# here would have changed that. `CI`'s unused `nightly` / `stable` entries are not carried — no
# step in this workflow, or in that one, references them.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # ── Gate: Miri — the shard plan the two Miri matrices are built from ────────
  # Miri sets this workflow's wall clock on its own, and set the whole of `CI`'s before the
  # split; Miri and only Miri is sharded.
  #
  # The shard COUNT lives in `ci/miri_shard.py` and the LIST is generated from it here, so the
  # matrices below never spell out `[0, 1, 2, 3]`: a count and a list written down separately can
  # disagree silently, dropping a quarter of the suite from Miri while every job stays green.
  #
  # `ci/miri_shard.py` re-proves the whole partition inside every Miri job anyway; running it
  # here first makes a broken plan red in seconds, once and readably, rather than after
  # `cargo miri setup` in every cell. `selftest` runs before `plan` for the reason the changelog
  # self-test runs before its gate in `CI`: a self-test CI never exercises rots, and a green
  # `plan` proves nothing about a guard nobody has watched fail on cue.
  #
  # No `rustup` step on purpose — it needs `cargo metadata --no-deps` and nothing else, and must
  # not add minutes to the head of the critical path it exists to shorten.
  miri-shard-plan:
    name: miri shard plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - name: ci/miri_shard.py selftest
        run: python3 ci/miri_shard.py selftest
      - name: Enumerate the integration suite and verify the partition
        id: plan
        run: python3 ci/miri_shard.py plan

  # ── Gate: Miri (Tree Borrows) ───────────────────────────────────────────────
  # `fail-fast: false` on both Miri matrices, because sharding changes what a fast failure costs:
  # the first shard to go red would otherwise cancel every other shard on every target, leaving
  # a report that says nothing about the rest of the suite and a next push that re-runs all of it.
  #
  # ── WHY THE APPLE CELLS NO LONGER NEED A macOS HOST ─────────────────────────
  # They ran on `macos-latest` until #216, under an `os` matrix axis and three `exclude` entries
  # per matrix that pinned each target to the only host that could build it. Miri was never the
  # reason — it interprets a TARGET, and `cargo miri setup --target x86_64-apple-darwin` /
  # `--target aarch64-apple-darwin` each build a full darwin sysroot (core, alloc, std, test,
  # panic_unwind, proc_macro) on an ubuntu runner in about fourteen seconds. `cargo build` was:
  # both apple legs died before Miri ran, in `alloca v0.4.0`'s cc-rs build script, which invokes
  # the host `cc` with `-arch x86_64 -mmacosx-version-min=10.7` (and `-arch arm64
  # -mmacosx-version-min=11.0`) — flags a Linux `cc` rejects and only Apple clang plus the macOS
  # SDK can serve.
  #
  # `alloca` was reached through exactly one edge: `criterion`, an unconditional entry in
  # tokora's `[dev-dependencies]`. Cargo resolves dev-dependencies per PACKAGE, not per target,
  # so `--test span` built criterion too. #216 moved the five benches into the `tokora-benches`
  # workspace member and criterion with them — cargo has no optional dev-dependency, so a
  # package boundary is the only available seam — and the apple legs then build and interpret on
  # ubuntu exactly as the linux one does. Measured in CI, on a Linux runner, before the fix was
  # written: run 31082043450, job 92552854128 (branch `ci/miri-linux-probe-216`, `ubuntu-latest`)
  # built both darwin sysroots, got exit 101 from `cargo miri test --target x86_64-apple-darwin`
  # inside `alloca`'s build script on the `-arch` flag, and then — with `criterion = "0.8"`
  # deleted from `tokora/Cargo.toml` and nothing else touched — passed the identical command on
  # BOTH apple targets, 95 tests each (3 `downcast` + 2 `dialect_anchor` + 90 `span`).
  #
  # So there is no `os` axis here any more, and no `exclude` list: every cell is `ubuntu-latest`.
  # Putting `criterion` back into `tokora/Cargo.toml` — or adding any dev-dependency with a
  # cc-rs build script — puts these 16 cells back on a macOS runner and the 269–347 minute queue
  # #157 measured back in front of them. `tokora/Cargo.toml` says so where the table is.
  miri-tb:
    name: miri-tb-${{ matrix.target }}-shard${{ matrix.shard }}
    needs: miri-shard-plan
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        cfg:
          - all_tests
        # Generated from `SHARD_TOTAL` in `ci/miri_shard.py`; never written out here.
        shard: ${{ fromJSON(needs.miri-shard-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_tb.sh ${{ matrix.target }} ${{ matrix.cfg }} ${{ matrix.shard }}

  # ── Gate: Miri (Stacked Borrows) ────────────────────────────────────────────
  # Deliberately the same matrix as `miri-tb` above, `runs-on` included; the note there on why
  # the apple cells no longer need a macOS host covers these eight too.
  miri-sb:
    name: miri-sb-${{ matrix.target }}-shard${{ matrix.shard }}
    needs: miri-shard-plan
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        cfg:
          - all_tests
        # Generated from `SHARD_TOTAL` in `ci/miri_shard.py`; never written out here.
        shard: ${{ fromJSON(needs.miri-shard-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Miri
        run: |
          bash ci/miri_sb.sh ${{ matrix.target }} ${{ matrix.cfg }} ${{ matrix.shard }}

name: CI

# ── THE BY-HAND GATE SET ────────────────────────────────────────────────────────────────
#
# There is no CONTRIBUTING.md and no gate script, so the set lives here. Every line exits 0
# before a push:
#
#     cargo fmt --check
#     cargo +stable clippy --all-features --all-targets --no-deps -- -D warnings
#     cargo test --all-features
#     cargo test --release --all-features
#     cargo +nightly check -p tokora --all-targets --all-features
#     cargo check -p tokora --no-default-features
#     cargo bench --all-features --no-run
#     RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
#     RUSTDOCFLAGS="-D warnings" cargo doc -p tokora --no-deps --no-default-features
#     RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps
#     bash ci/changelog_structure.sh CHANGELOG.md
#     bash ci/feature_cfg_coverage_selftest.sh
#     python3 ci/feature_cfg_coverage.py
#     python3 ci/feature_cfg_coverage.py --print-legs \
#       | while read -r leg; do cargo check -p tokora $leg || break; done
#     bash ci/name_collision/run.sh <merge-base> <inventory.json>   # see that job for the
#                                                                  # inventory it requires
#
# `cargo bench --no-run` used to be the only line compiling `parser_combinators`, `pratt_typed`,
# `cst` and `backtrack` — `bench (smoke)` below built only `input_scan` (#181). It now builds
# and test-runs all five, so this line is redundant with CI; kept as a fast local compile-only
# check, now `--all-features` so it actually builds all five — none of the five default to
# enabling `logos`, so the bare form silently compiled zero of them.
#
# Four of the remaining lines look redundant beside a broader command and are not — each catches
# a class no other line in the set can:
#
#   * the bare-config rustdoc build is the only leg that sees bare-config intra-doc breakage:
#     `--all-features` documents every item, so a link whose TARGET is feature-gated always
#     resolves there.
#   * the `--cfg docsrs` rustdoc build is the only leg that expands `doc(cfg(...))` at all. The
#     attribute is INERT without that cfg, so the two plain doc lines above cannot see a
#     misapplied one — and docs.rs itself builds with it. Ten `#[cfg_attr(docsrs, doc(cfg(...)))]`
#     sitting on block expressions instead of items made this line exit 101 while every other
#     gate in the set was green, which is a docs.rs build failure nothing here could produce
#     (#195).
#   * the feature-combination legs and their coverage script are the only lines that build a
#     PAIR of features. `cargo hack --each-feature` runs each feature alone and `--all-features`,
#     never a proper subset of size two or more, so an `all(A, B)` predicate is compiled in
#     exactly one leg — the one where a third feature can supply whatever the pair was missing
#     (#200).
#   * the name-collision probe needs a two-sided, GENERATED inventory rather than a fixed
#     command line — which is why it went missing from this list, and why a branch that minted
#     new item owners first heard about it from CI.
#
# Features work the same way: only the `--all-features` / `--features rowan` legs compile the
# `rowan`-gated lossless path, so a configuration no line above names is a configuration
# nothing compiles. When a change adds a configuration, a target, a feature or a public owner,
# ask which line goes red if it breaks — and when the answer is "none", the missing thing is
# the line, not the test.

# ── EVERY CARGO TARGET KIND, AND WHAT REACHES IT ────────────────────────────────────────────
#
# Six of the defects found in the week of 2026-08 were one shape — a gate whose stated scope was
# wider than what it actually built, silently, because cargo answers "nothing matched" with a
# warning and exit 0 (#181, #195, #200, #208, #217, #220). The set of cargo target KINDS is short
# and finite, so it is written out here once rather than rediscovered a seventh time. Counts are
# `cargo metadata --no-deps`'s, and every "linted by" below was counted off the
# `--message-format=json` artifact stream, not inferred from a flag's name.
#
#   * **lib** (1) — built by nearly every job. Clippy-linted by `clippy` and `hack-clippy`; run
#     as a unittest by `test`, `test-valve-off`, `test-release`, `logos-versions`, `no-std` and
#     `coverage`.
#   * **bins** (0) — none declared. `--all-targets` on the `clippy` line carries any that appear.
#   * **custom-build** (1, `tokora/build.rs`) — built by every job that builds the crate, and it
#     IS clippy-linted, which is worth knowing because no `--<kind>` flag names it: it rides
#     along with the package. Confirmed by injecting a `clippy::len_zero` into it and watching
#     the `clippy` line report it, rather than by reading the flag list.
#   * **tests** (103 integration targets) — clippy-linted by `clippy` and by
#     `hack-clippy --tests`; run by the five test jobs above.
#   * **benches** (5) — clippy-linted by `clippy`; compiled and executed once each by
#     `bench (smoke)`.
#   * **examples** (8) — clippy-linted by `clippy` **only since #220**; before that `--tests`
#     and `--benches` were the whole job and neither reaches an example, so all eight had never
#     been linted and four were red for as long as they had existed. Compiled by
#     `cargo test --all-features` in `test` — cargo builds examples to prove they still compile —
#     and by `pages.yml`'s *Compile canonical examples*, which is the only step that RUNS their
#     `#[cfg(test)]` cells.
#   * **doctests** — run by `test`, by `pages.yml` under four feature points, and by
#     `coverage --doctests`. **Clippy-linted by nothing, and not fixable from here**:
#     `--all-targets` excludes doctests by definition and clippy has no doctest mode, because
#     rustdoc rather than clippy-driver is what compiles them. A clippy finding that lives only
#     in a doctest is therefore invisible to this workflow, and that is not hypothetical — the
#     ten `parse_lossless(src, Default::default(), ...)` calls in `guide/ch16_lossless_cst.md`
#     were the same `clippy::unit_arg` as the four in `examples/` that #220 fixed, and no gate
#     could see either set. Both sets are fixed by hand; the next one will have to be too.
#
# Two things are not cargo targets at all, so they appear under no `--<kind>` flag: the
# `tests/ui/*.rs` trybuild cases, which the `diagnostics` test target compiles and only on the
# pinned MSRV (hence that job asserting on an executed-case count — a skip is otherwise
# indistinguishable from a pass), and the guide chapters under `tokora/src/guide/`, which reach
# rustc only as the doctests above.

# ── THIS IS THE FAST LANE ───────────────────────────────────────────────────────────────────
#
# Every job here runs on `ubuntu-latest`. The Miri matrices — the only macOS-bound cells in the
# repository — live in `.github/workflows/miri.yml`, and that file's header carries the
# measurement that separated them (#213): on 2026-08-05 five consecutive main commits merged
# with no CI verdict at all, because a run's conclusion is a property of the WHOLE run and the
# 24 Miri cells never got runners. In the measured run, 34 of 59 jobs finished inside 50
# minutes — two of them RED — and none of those 34 verdicts could be read.
#
# So the contract is: this workflow's conclusion is the one a merge waits for, and it is
# answerable in tens of minutes because nothing in it queues for a macOS runner. `Miri` reports
# on its own clock. Adding a `runs-on:` here that is not `ubuntu-latest` gives that up — the
# whole lane is then only as fast as its slowest host, which is the state this split undid.

# `paths-ignore` deliberately does NOT carry a blanket `**.md`: the guide chapters under
# `tokora/src/guide/` are Markdown compiled as doctests through `include_str!` and `README.md`
# is `include_str!`'d into the crate root, so those are *code* changes here. `CHANGELOG.md` is
# gated by the `changelog` job below.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  pull_request:
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"

concurrency:
  # One in-flight run per workflow per ref, so a branch's CI reflects its tip rather than a queue
  # of stale commits — except on `main`, where the group is keyed on the commit SHA so that every
  # main commit gets its own group and its own verdict. Do NOT collapse that back to one group per
  # ref: `cancel-in-progress: false` does not protect a main run on its own, because a run queued
  # into a group that already has one in progress cancels whichever run was PENDING there
  # regardless of that setting, and a main run only has to be pending for as long as it takes the
  # next push to arrive. That was the Miri matrices' doing when they were in this file (#141);
  # they are in `miri.yml` now and keyed the same way, and this lane still queues behind runner
  # availability whenever several branches are in flight — so the SHA keying is load-bearing in
  # both files and is not a Miri workaround that the split retired.
  #
  # `${{ github.workflow }}` leading the group is also what keeps the two lanes apart: `CI-...`
  # and `Miri-...` are different groups, so neither can cancel the other's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # ── Gate: changelog structure ───────────────────────────────────────────────
  # The one load-bearing release artifact no compiler, linter or test reads. Merge-blocker, not
  # advisory: it costs seconds and needs no toolchain.
  #
  # The self-test runs FIRST and is not optional. It injects one defect at a time into the real
  # CHANGELOG.md and requires each to red with the diagnosis it was planted to provoke; the
  # checker has twice been caught passing on an already-broken changelog, so a green from it
  # means nothing until something has watched it go red. Running it first also means a broken
  # checker reports itself by name rather than as a confusing verdict on the changelog.
  changelog:
    name: changelog structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ci/changelog_structure_selftest.sh
        run: bash ci/changelog_structure_selftest.sh
      - name: ci/changelog_structure.sh CHANGELOG.md
        run: bash ci/changelog_structure.sh CHANGELOG.md

  # ── Gate: formatting ────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - name: cargo +stable fmt --all -- --check
        run: cargo +stable fmt --all -- --check

  # ── Gate: clippy (EVERY target kind, no deps, deny warnings) ────────────────
  #
  # `--all-targets`, not the `--tests` + `--benches` pair this job ran until #220. Between them
  # those two reach the lib, the build script, the 103 integration tests and the five benches —
  # and no example. So the eight `examples/` targets had never been linted by anything, and four
  # of them were red the whole time: `parse_lossless(src, Default::default(), ..)` passes a unit
  # value, which is `clippy::unit_arg`, so `clippy --all-features --all-targets` exited 101 on
  # `main` while this job was green.
  #
  # Counted off the `--message-format=json` artifact stream rather than inferred: `--tests`
  # processes 105 tokora targets, `--benches` 7, and `--all-targets` 118 — their union plus
  # exactly the eight examples. One invocation is also cheaper than two, because the lib is
  # checked once instead of twice.
  #
  # `--all-targets` is a target FILTER, and a filter is the silent shape: one that satisfies
  # nothing warns `no targets matched` and exits 0, which is how `pages.yml` compiled zero
  # examples for its whole existence (#217). It is safe on THIS line only because `--all-features`
  # sits on it: a target's `required-features` are by construction a subset of all features, so
  # nothing can be filtered out. Narrowing the feature set here without narrowing the claim
  # reopens exactly that hole — name the targets instead, since `--example NAME` errors where
  # `--examples` shrugs.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - name: clippy --all-features --all-targets --no-deps -D warnings
        run: cargo +stable clippy --all-features --all-targets --no-deps -- -D warnings

  # ── Gate: MSRV (the workspace `rust-version`; see the policy note in Cargo.toml) ─
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read declared MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version *= *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --no-self-update --profile minimal
      - name: cargo +${{ steps.msrv.outputs.version }} check -p tokora --all-features
        run: cargo +${{ steps.msrv.outputs.version }} check -p tokora --all-features
      # The trybuild half of `tests/diagnostics.rs` runs here and nowhere else: its committed
      # `.stderr` files are pinned to the declared MSRV and the harness returns early on any
      # other rustc.
      #
      # So exit 0 is NOT the pass condition — a skip is indistinguishable from a pass, and every
      # compile-time rail routed through that file would retire silently the first time this
      # job's toolchain drifts. The step asserts on the executed-case count the harness prints.
      - name: cargo +${{ steps.msrv.outputs.version }} test --test diagnostics (asserting a nonzero executed-case count)
        run: |
          set -euo pipefail
          cargo +${{ steps.msrv.outputs.version }} test -p tokora --all-features --test diagnostics -- --nocapture \
            | tee /tmp/diagnostics.out
          count=$(sed -n 's/^TOKORA_TRYBUILD_EXECUTED_CASES=\([0-9][0-9]*\)$/\1/p' \
            /tmp/diagnostics.out | head -1)
          if [ -z "${count}" ]; then
            echo "::error::the diagnostics harness printed no executed-case marker — it did" \
                 "not run, or the marker was renamed without updating this step"
            exit 1
          fi
          if [ "${count}" -eq 0 ]; then
            echo "::error::the diagnostics harness skipped itself (0 cases executed): this" \
                 "job's rustc is not the pinned MSRV, so every trybuild rail is inert here"
            exit 1
          fi
          echo "diagnostics: ${count} trybuild case(s) executed on the pinned toolchain"

  # ── Gate: full test suite ───────────────────────────────────────────────────
  test:
    name: test (all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo test --all-features
        run: cargo test --all-features

  # ── Gate: valve-off flavor (logos + std, no other source/container valves) ──
  test-valve-off:
    name: test (valve-off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-valveoff-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-valveoff-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo test -p tokora --features logos,std
        run: cargo test -p tokora --features logos,std

  # ── Gate: release profile — the profile where `debug_assertions`-gated nets ─
  #    vanish, so it is the only place a release-only divergence can show.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-release-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo test --release -p tokora --all-features --lib
        run: cargo test --release -p tokora --all-features --lib
      # The WHOLE integration suite, not a curated list of suites: the debug/release divergences
      # this crate has had to fix live substantially in integration targets such a list did not
      # name, so a release-only regression in any of them passed CI.
      - name: cargo test --release -p tokora --all-features --tests
        run: cargo test --release -p tokora --all-features --tests
      # The `#[ignore]`d deep fuzz sweep, seeds 0..50_000, which nothing else in CI runs. Per-PR
      # rather than on a cron because it is not throughput-bound — ~0.1s in release, on top of a
      # build this job has already paid for two steps above.
      - name: cargo test --release --all-features -- --ignored fuzz_deep_run
        run: cargo test --release -p tokora --all-features --lib -- --ignored --exact fuzz::tests::fuzz_deep_run

  # ── Gate: per-version logos parity ──────────────────────────────────────────
  # The crate advertises three logos majors, and this is the only job that RUNS tests against
  # 0.14 and 0.15: the `hack --each-feature` matrix only clippy-checks each version, and every
  # other test job pins the newest. `fail-fast: false` so one version's failure does not hide
  # the other's result.
  logos-versions:
    name: logos parity (0.14, 0.15)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        logos: [logos_0_14, logos_0_15]
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-logos-${{ matrix.logos }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-logos-${{ matrix.logos }}-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      # `combinators` is spelled out because it is a DEFAULT feature: without it this leg
      # would still compile, but every combinator suite is `#![cfg]`'d on it, so the run
      # would silently shrink to the handful of files that need no combinator at all.
      #
      # `conformance` is spelled out for the same reason and is not optional here: the cache
      # conformance kit (`tokora::conformance::cache_tests`) builds its fixture lexer with a
      # real `logos::Logos` derive, so it is the most version-sensitive file in the crate — and
      # until this feature was named here, the one leg whose entire purpose is version parity
      # was the one leg that never compiled it, so it ran against exactly one of the three
      # advertised logos majors (whichever `--all-features` selects) instead of all three (#208).
      - name: cargo test --no-default-features --features std,combinators,conformance,${{ matrix.logos }}
        run: cargo test -p tokora --no-default-features --features std,combinators,conformance,${{ matrix.logos }}

  # ── Gate: mechanical public-API diff against the last published version ─────
  # `continue-on-error` is deliberate and the reason is written down because "advisory" usually
  # decays into "ignored": the tool rides rustdoc-JSON on a pinned nightly, so a toolchain bump
  # can redden this job without the crate changing. It blocks nothing until it has a quiet week
  # on main.
  #
  # It is here because the recall-shaped sources a changelog is otherwise reconstructed from —
  # PR bodies, commit messages, surface greps — are structurally blind to bound additions and to
  # derived-`Debug` movement, which this diff sees.
  semver-checks:
    name: semver-checks (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install cargo-semver-checks (pinned)
        run: cargo install cargo-semver-checks --locked --version 0.49.0
      - name: cargo semver-checks against the published baseline
        run: cargo semver-checks check-release -p tokora --all-features

  # ── Gate: name-collision probe ──────────────────────────────────────────────
  # Adding a public name is not additive at the source level, and no rule about *when* a
  # collision is loud has survived contact with the spellings. So this job checks no rule: it
  # derives the inventory of names the branch adds, compiles one byte-identical consumer against
  # the merge base and against the branch — **against each name's real owner** — and fails on
  # the outcome no diagnostic can report: both sides compile, neither warns, and the runtime
  # witness disagrees.
  #
  # The inventory is REQUIRED and generated, never hand-listed; `run.sh` refuses to start
  # without it, because a probe over one hard-coded name reports green over every name it never
  # ran. Generating it from both sides' rustdoc JSON is also why this gate is not a bare `cargo`
  # line and so is easy to leave out of a local run — reproduce it as the two steps below.
  name-collision:
    name: name-collision-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchains
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup toolchain install nightly
      - name: Derive the added-name inventory from rustdoc JSON, both sides
        env:
          # MSRV-aware version selection is OFF for this step, on BOTH sides, and that is what
          # makes the lock-parity check below meaningful rather than merely strict.
          #
          # Since cargo 1.84 the resolver reads each workspace's declared `rust-version` and
          # holds a dependency back when its own `rust-version` is higher. That makes the
          # RESOLVED GRAPH a function of the MSRV field — and the two sides of this job do not
          # have to declare the same MSRV, for exactly the reason spelled out below for
          # features. #211 raised the floor from 1.87 to 1.95 and `b8773b80`'s push run went
          # red here with
          #
          #     only in base: trybuild 1.0.119
          #     only in head: trybuild 1.0.120
          #
          # because trybuild 1.0.120 declares `rust-version = 1.88`: admissible to head, held
          # back on base. Nothing about the dependency graph had changed — one manifest field
          # had. The guard was right that the graphs differed and wrong to conclude anything
          # from it, and every future MSRV bump would red the bump commit and its PR the same
          # way.
          #
          # `allow` takes `rust-version` out of resolution on both sides, so the only inputs
          # left are the dependency requirements themselves — which is precisely the thing the
          # comparison is asking about. It is right HERE and would be wrong in the `msrv` job,
          # whose whole subject is that the declared floor builds; that job resolves normally.
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "base=$base" >> "$GITHUB_ENV"
          # The feature point this gate WANTS. It is resolved against EACH SIDE's manifest
          # below and never handed to both sides as written, because the two sides do not
          # have to declare the same features: a PR that ADDS one has a head that knows the
          # name and a base that does not, and `cargo doc --features <unknown>` is a hard
          # error (exit 101), not a warning. One shared list therefore reddens this job on
          # exactly the PRs that introduce a feature — and again on the push run after the
          # merge, where base becomes `HEAD~1`. Resolving per side is the general form; a
          # transitional special case naming one feature would have to be written again for
          # the next one.
          want="std,logos,trace,rowan,combinators"
          mkdir -p /tmp/nc && git worktree add /tmp/nc/base "$base"
          # `Cargo.lock` is gitignored, and each side must resolve its OWN lock: one lock
          # generated from head and copied into base goes unsatisfiable the moment the PR
          # edits base's manifest at all — a bare package-`version` bump is enough, and
          # `--locked` then refuses base outright.
          #
          # The comparison below is what that copied lock used to prove, made explicit: every
          # `[[package]]` triple (name, version, source) must match across both locks, with
          # tokora's own version the one allowed difference, so that a finding cannot be an
          # artifact of the two `cargo doc` runs linking different versions of some third
          # crate. Deleting it gives that guarantee up silently. `--locked` stays on both
          # `cargo doc` calls so a re-resolution during doc generation is refused.
          #
          # Both resolutions run under the step's
          # `CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=allow`, so a difference in the two
          # sides' declared `rust-version` cannot manufacture a difference in the two locks —
          # see the note on the step's `env`.
          cargo generate-lockfile
          ( cd /tmp/nc/base && cargo generate-lockfile )
          python3 - <<'PY'
          import re, sys

          def parse_lock(path):
              text = open(path, encoding="utf-8").read()
              out = []
              for block in re.split(r"(?m)^\[\[package\]\]\s*$", text)[1:]:
                  stop = re.search(r"(?m)^\[", block)
                  body = block[: stop.start()] if stop else block
                  name = re.search(r'(?m)^name\s*=\s*"([^"]*)"', body)
                  version = re.search(r'(?m)^version\s*=\s*"([^"]*)"', body)
                  source = re.search(r'(?m)^source\s*=\s*"([^"]*)"', body)
                  if not name or not version:
                      sys.exit(
                          f"::error::{path}: a [[package]] block has no name/version; "
                          "the lock format has changed under this parser"
                      )
                  out.append((
                      name.group(1),
                      version.group(1),
                      source.group(1) if source else None,
                  ))
              return out

          head = parse_lock("Cargo.lock")
          base = parse_lock("/tmp/nc/base/Cargo.lock")

          if not any(n == "tokora" for n, _, _ in head):
              sys.exit("::error::Cargo.lock: no tokora [[package]] entry")
          if not any(n == "tokora" for n, _, _ in base):
              sys.exit("::error::/tmp/nc/base/Cargo.lock: no tokora [[package]] entry")

          head_set, base_set = set(head), set(base)
          only_head = {t for t in head_set - base_set if t[0] != "tokora"}
          only_base = {t for t in base_set - head_set if t[0] != "tokora"}

          if only_head or only_base:
              print("::error::lock graphs disagree beyond tokora's own version")
              for n, v, s in sorted(only_base):
                  print(f"  only in base: {n} {v} ({s or 'path/local'})")
              for n, v, s in sorted(only_head):
                  print(f"  only in head: {n} {v} ({s or 'path/local'})")
              sys.exit(1)

          print("lock parity OK: graphs agree except tokora's own version")
          PY
          # The per-side resolver for `want`. It reads `cargo metadata` rather than grepping
          # the `[features]` table because that is cargo's own parser: it reports the implicit
          # feature an optional dependency creates alongside the written ones, so a feature
          # that exists is never mistaken for one that does not. Dropping a name is REPORTED,
          # not silent — a shrunken feature point means a smaller documented surface, and this
          # gate's whole subject is which names that surface gained.
          cat > /tmp/nc/resolve_features.py <<'PY'
          import json, sys

          want, side = sys.argv[1], sys.argv[2]
          meta = json.load(sys.stdin)
          pkg = next((p for p in meta["packages"] if p["name"] == "tokora"), None)
          if pkg is None:
              sys.exit("::error::%s: cargo metadata reports no tokora package" % side)
          have = set(pkg["features"])
          asked = [f.strip() for f in want.split(",") if f.strip()]
          keep = [f for f in asked if f in have]
          drop = [f for f in asked if f not in have]
          if drop:
              print("name-collision: %s does not declare %s — dropped from its feature point"
                    % (side, ", ".join(drop)), file=sys.stderr)
          if not keep:
              sys.exit("::error::%s declares none of [%s]; the wanted feature point is stale"
                       % (side, want))
          print(",".join(keep))
          PY
          head_feat=""
          for side in base head; do
            dir="/tmp/nc/base"; [ "$side" = head ] && dir="$PWD"
            feat="$(cargo metadata --no-deps --format-version 1 \
                      --manifest-path "$dir/tokora/Cargo.toml" \
                    | python3 /tmp/nc/resolve_features.py "$want" "$side")"
            echo "name-collision: $side feature point = $feat"
            if [ "$side" = head ]; then head_feat="$feat"; fi
            ( cd "$dir" && RUSTC_BOOTSTRAP=1 \
                RUSTDOCFLAGS="-Z unstable-options --output-format json" \
                cargo doc -p tokora --no-deps --features "$feat" --locked )
            cp "$dir/target/doc/tokora.json" "/tmp/nc/$side.json"
          done
          # The HEAD side's feature point is the one recorded in the inventory: the inventory
          # is a statement about the surface this branch publishes, and `run.sh` builds the
          # probe crate at whatever it records.
          python3 ci/name_collision/surface_diff.py \
            /tmp/nc/base.json /tmp/nc/head.json --features "$head_feat"
          cp /tmp/nc/surface_names.json /tmp/nc/inventory.json
      - name: Probe every added name against its real owner
        run: bash ci/name_collision/run.sh "$base" /tmp/nc/inventory.json

  # ── Gate: sanitizers ────────────────────────────────────────────────────────
  # One sanitizer per cell, `fail-fast: false`, so an unsupported sanitizer reports as one red
  # cell rather than aborting the run. `leak` and `memory` are deliberately NOT in the matrix:
  # they are unsupported on some targets, and an expected-failure cell inverts silently the day
  # support lands.
  #
  # If a leg fails at BUILD time with an ABI or interceptor mismatch, read `ci/sanitizer.sh`'s
  # header before filing it: the thread leg needs `-Zbuild-std` for an instrumented `std`, and
  # its absence produces a failure that reads like a sanitizer report.
  sanitizer:
    name: sanitizer (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-san-${{ matrix.san }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-san-${{ matrix.san }}-
      - name: Install Rust (nightly + rust-src for -Zbuild-std)
        run: |
          rustup toolchain install nightly --no-self-update --component rust-src
          rustup default nightly
      - name: ci/sanitizer.sh
        run: bash ci/sanitizer.sh x86_64-unknown-linux-gnu ${{ matrix.san }}

  # ── Gate: the cargo-hack per-feature clippy matrix (its own job) ────────────
  hack-clippy:
    name: hack clippy (each-feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-hack-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-hack-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: cargo +stable hack clippy -p tokora --each-feature --no-deps --tests -D warnings
        run: cargo +stable hack clippy -p tokora --each-feature --no-deps --tests -- -D warnings

  # ── Gate: the feature COMBINATIONS --each-feature cannot reach ──────────────
  #
  # The job above runs `--no-default-features`, each of the 40 features ALONE, and
  # `--all-features` — 42 legs, and never a proper subset of size two or more. So an
  # `all(A, B)` predicate is compiled in exactly ONE of them, `--all-features`, where a third
  # feature may supply whatever the pair itself was missing. That is coverage-shaped and is not
  # coverage: downstream in smear, a `rowan + graphqlx` pair failed from the commit that
  # introduced it with green CI on every run in between, because `rowan` alone did not compile
  # the macros, `graphqlx` alone did not compile the substrate, and `--all-features` also had
  # `graphql`, which supplied the consumers whose absence was the bug (#200).
  #
  # `--feature-powerset --depth 2` would close it and is the wrong trade at 40 features: ~780
  # configurations buys a gate nobody keeps. That was written when the Miri queue was also in
  # this workflow and the argument was partly a wall-clock one; Miri is in `miri.yml` now and the
  # argument is unchanged, because ~780 `cargo check` legs would themselves make this lane the
  # slow one. So the legs are derived from the cfgs that ACTUALLY EXIST, and
  # `ci/feature_cfg_coverage.py` is what stops that derivation going stale — three legs are a
  # snapshot, and the next `all(...)` predicate someone writes would be uncovered again with
  # green CI.
  #
  # The leg list is deliberately NOT repeated here. This job asks the script to print it and
  # runs what it prints, so the set CI builds and the set the script validates cannot drift.
  #
  # The self-test runs FIRST and is not optional, for the same reason the changelog one does.
  # A coverage script's OK path is the path everything already takes, which makes "passes by
  # not looking" its natural failure mode — the very first run of this gate reported zero
  # predicates found, from a real bug in its own scanner, and only the positive control told
  # that apart from a green.
  feature-combinations:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-featcomb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-featcomb-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: ci/feature_cfg_coverage_selftest.sh
        run: bash ci/feature_cfg_coverage_selftest.sh
      - name: python3 ci/feature_cfg_coverage.py
        run: python3 ci/feature_cfg_coverage.py
      - name: cargo check, one leg per declared feature combination
        run: |
          set -euo pipefail
          mapfile -t legs < <(python3 ci/feature_cfg_coverage.py --print-legs)
          [ "${#legs[@]}" -gt 0 ] || { echo "no legs declared" >&2; exit 1; }
          for leg in "${legs[@]}"; do
            echo "::group::cargo check -p tokora $leg"
            # Word splitting is the point: $leg is a flag string from the declaration.
            # shellcheck disable=SC2086
            cargo check -p tokora $leg
            echo "::endgroup::"
          done

  # ── Gate: no-std / bare-metal builds ────────────────────────────────────────
  no-std:
    name: no-std (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-nostd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nostd-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Add bare-metal target
        run: rustup target add thumbv6m-none-eabi
      - name: cargo build --no-default-features
        run: cargo build --no-default-features
      - name: cargo check --target thumbv6m-none-eabi --no-default-features
        run: cargo check --target thumbv6m-none-eabi --no-default-features
      - name: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc
        run: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc
      # Compile-only to RUNTIME: `cargo build --no-default-features` above compiles no test
      # targets at all, so a `Vec`/`vec!` violation in a test — where one has actually been
      # found — slips past it. These two host runs execute the no_std tiers of the crate's own
      # code (the harness links std; the crate paths under test do not).
      - name: cargo test -p tokora --no-default-features
        run: cargo test -p tokora --no-default-features
      - name: cargo test -p tokora --no-default-features --features alloc
        run: cargo test -p tokora --no-default-features --features alloc
      # The positive cell for CAS-less targets: `bstr` is the CAS-less-safe backing, pinned on
      # the real CAS-less target. The three CAS-needing backings (`bytes`, `hipstr`,
      # `smol_bytes`) are documented on their guide rows rather than pinned here as
      # expected-failures — an expected-fail cell inverts silently the day upstream fixes it.
      - name: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc,bstr_1
        run: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc,bstr_1

  # ── Gate: docs build with deny-warnings ─────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-doc-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps
      # The ONLY leg that can see bare-config intra-doc breakage — links into a `rowan`-gated
      # module from ungated ones have reddened it while every other gate stayed green. The
      # all-features step above documents every item, so a link whose TARGET is feature-gated
      # always resolves there.
      #
      # No RUSTDOCFLAGS needed: the crate's own `#![deny(missing_docs, warnings)]` in
      # `tokora/src/lib.rs` is what turns rustdoc's broken-link warnings into errors here.
      # Acceptance is exit 0 and must stay exit 0, never a diagnostic count: rustdoc aborts
      # early, so any count is a floor and a floor cannot detect a missing member.
      - name: cargo doc --no-default-features --no-deps (bare-config link resolution)
        run: cargo doc -p tokora --no-deps --no-default-features
      # The ONLY leg that builds documentation the way docs.rs does, and the only one that
      # expands `doc(cfg(...))` at all. The attribute is inert without `--cfg docsrs`, so both
      # steps above compile every `#[cfg_attr(docsrs, doc(cfg(...)))]` in the crate away to
      # nothing and cannot tell a correct one from a misapplied one. docs.rs builds WITH the
      # cfg — that is the entire reason the pattern exists — so a fault only this leg can see is
      # a real published-docs build failure, found after publish, which is the worst place to
      # find it.
      #
      # It was not hypothetical when this step was added: ten of the attributes sat on block
      # expressions rather than on items, and rustdoc's `unused_doc_comments` (an error here via
      # the crate's own `#![deny(missing_docs, warnings)]`) took the build to exit 101 while
      # every other gate in the workflow was green (#195). Two of the three siblings in
      # `state/tracker/mod.rs` were already written the right way, so the fault was invisible
      # even to a reader comparing neighbours.
      #
      # Nightly, because `doc(cfg)` is a nightly feature — the same toolchain docs.rs uses.
      - name: Install Rust (nightly, for the docs.rs configuration)
        run: rustup toolchain install nightly --no-self-update
      - name: RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc --all-features --no-deps

  # ── Gate: bench SMOKE only ──────────────────────────────────────────────────
  #
  # Compiles all five declared bench targets and runs each once in test mode (`-- --test`),
  # which runs every benchmark body once instead of criterion's real sampling loop (#181).
  # `--no-default-features --features std,logos,rowan,unstable-raw,combinators` is the exact
  # union of every bench target's `required-features` in `tokora/Cargo.toml` — not
  # `--all-features`, which would also enable `trace`: `cst.rs`'s own header says running under
  # `trace` is roughly an order of magnitude slower and a configuration nobody ships.
  #
  # `combinators` is in that union and has to be SPELLED OUT, because `--no-default-features`
  # turns it off and it is what every bench's `required-features` now carries. A bench whose
  # required features are not enabled is SKIPPED, not failed, so leaving it out does not red
  # this job — it compiles zero of the five and reports `Finished` in about 30ms, which is
  # exactly the shape of the #181 gap this job was created to close.
  #
  # NOT a timed regression gate: GitHub runners are far too noisy for the ±2% discipline these
  # benches are held to locally, so regression numbers are gathered off-CI.
  bench-smoke:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo bench --no-default-features --features std,logos,rowan,unstable-raw,combinators -- --test
        run: cargo bench --no-default-features --features std,logos,rowan,unstable-raw,combinators -- --test

  # ── Gate: cross-compile smoke across extra platforms ────────────────────────
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  # ── Gate: coverage (gated on the fast gates passing) ────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - test
      - cross
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly && rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Generate coverage with llvm-cov
        run: cargo llvm-cov --all-features --workspace --doctests --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: lcov.info
          fail_ci_if_error: true

name: CI

# The `Gate` jobs below encode the exact local gate discipline this branch developed:
# formatting, the targeted clippy passes, the full and valve-off test flavors, the
# release-profile suites (where debug-only nets vanish), the `cargo hack` per-feature
# clippy matrix, the no-std / bare-metal builds, the deny-warnings doc build, and a bench
# smoke check. Every job mirrors a command that is run by hand before pushing. The
# orthogonal `cross`, `miri-*` and `coverage` jobs are preserved from the prior workflow.

# `paths-ignore` deliberately does NOT carry a blanket `**.md`. The guide chapters under
# `tokora/src/guide/` are Markdown compiled as doctests through `include_str!`, so a
# guide-only change is a *code* change here; ignoring `**.md` meant such a PR landed with
# zero CI. `CHANGELOG.md` is likewise gated — by the `changelog` job below. Only the root
# prose files are ignored.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  pull_request:
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # ── Gate: changelog structure ───────────────────────────────────────────────
  # The one load-bearing release artifact with no compiler. A rebase once resolved
  # `CHANGELOG.md` as a verbatim union — textually correct, no conflict markers — and
  # silently ate a `### Changed (breaking)` heading, filing six breaking changes under
  # `### Performance`. Every job below passed, because nothing reads a changelog.
  # Seconds, no toolchain, deterministic: this one is a merge-blocker, not advisory.
  changelog:
    name: changelog structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ci/changelog_structure.sh CHANGELOG.md
        run: bash ci/changelog_structure.sh CHANGELOG.md

  # ── Gate: formatting ────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - name: cargo +stable fmt --all -- --check
        run: cargo +stable fmt --all -- --check

  # ── Gate: clippy (tests + benches, no deps, deny warnings) ──────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - name: clippy --all-features --tests --no-deps -D warnings
        run: cargo +stable clippy --all-features --tests --no-deps -- -D warnings
      - name: clippy --all-features --benches --no-deps -D warnings
        run: cargo +stable clippy --all-features --benches --no-deps -- -D warnings

  # ── Gate: MSRV (the workspace `rust-version`; see the policy note in Cargo.toml) ─
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-
      - name: Install Rust
        run: rustup toolchain install 1.87 --no-self-update --profile minimal
      - name: cargo +1.87 check -p tokora --all-features
        run: cargo +1.87 check -p tokora --all-features
      # The trybuild pins (tests/diagnostics.rs): the committed `.stderr` files are pinned to this
      # toolchain and the test skips itself on any other rustc, so this job is the only
      # place the trybuild half runs. The file-only half runs in every `test` job.
      #
      # exit 0 is NOT the pass condition here. The harness returns early on any rustc
      # that is not 1.87 and the test then passes having compiled nothing — a skip is
      # indistinguishable from a pass, and every compile-time rail routed through this file
      # would retire silently the first time this job's toolchain drifts. The harness prints
      # its executed-case count; this step asserts on the count.
      - name: cargo +1.87 test --test diagnostics (asserting a nonzero executed-case count)
        run: |
          set -euo pipefail
          cargo +1.87 test -p tokora --all-features --test diagnostics -- --nocapture \
            | tee /tmp/diagnostics.out
          count=$(sed -n 's/^TOKORA_TRYBUILD_EXECUTED_CASES=\([0-9][0-9]*\)$/\1/p' \
            /tmp/diagnostics.out | head -1)
          if [ -z "${count}" ]; then
            echo "::error::the diagnostics harness printed no executed-case marker — it did" \
                 "not run, or the marker was renamed without updating this step"
            exit 1
          fi
          if [ "${count}" -eq 0 ]; then
            echo "::error::the diagnostics harness skipped itself (0 cases executed): this" \
                 "job's rustc is not the pinned 1.87, so every trybuild rail is inert here"
            exit 1
          fi
          echo "diagnostics: ${count} trybuild case(s) executed on the pinned toolchain"

  # ── Gate: full test suite ───────────────────────────────────────────────────
  test:
    name: test (all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo test --all-features
        run: cargo test --all-features

  # ── Gate: valve-off flavor (logos + std, no other source/container valves) ──
  test-valve-off:
    name: test (valve-off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-valveoff-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-valveoff-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo test -p tokora --features logos,std
        run: cargo test -p tokora --features logos,std

  # ── Gate: release profile (the profile where debug_assertions-gated nets
  #    vanish). Filtered to `--lib` — the crate's own unit-test suites, where the
  #    guard / stacked / parse_state session / sync / recover / raw-checkpoint
  #    invariants live — plus the matching integration binaries. The remaining
  #    ~60 integration binaries are already exercised by the debug `test` job;
  #    compiling them in release too would not add coverage of a debug-only net. ─
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-release-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo test --release -p tokora --all-features --lib
        run: cargo test --release -p tokora --all-features --lib
      # This job's release coverage was once a curated five-suite list. The debug/release
      # divergences this crate has had to fix live substantially in integration suites that list
      # did NOT name — the terminal-stop families, the delimiter suites, the probe-close cell —
      # so a release-only regression in any of them passed CI. Release suites were run locally
      # instead; this makes that coverage infrastructure rather than habit.
      #
      # Cost, measured before pinning rather than argued: a COLD build plus run of all 94
      # integration targets is **89s wall / 364s CPU** locally. It parallelises well, so a
      # slower runner scales on wall clock roughly with core count; even at 5x this is minutes,
      # against the ~20min fallback threshold that would have justified keeping a curated list.
      # No fallback is needed and none is configured.
      - name: cargo test --release -p tokora --all-features --tests
        run: cargo test --release -p tokora --all-features --tests
      # The deep fuzz sweep, seeds 0..50_000. It is `#[ignore]`d and had never run
      # anywhere — not in CI, not in the normal suite.
      #
      # The plan was a cron-only job on the assumption it is throughput-bound. **Measured, it is
      # not**: 0.10s in release and 0.85s in debug for all 50 000 seeds (the 8.5x ratio is what
      # says it is doing the work rather than short-circuiting). The whole cost is the build,
      # which this job has already paid two steps above.
      #
      # So it runs per-PR rather than monthly, which is strictly more coverage for ~0.1s. A
      # measurement that overturns the plan in the cheap direction is still a measurement.
      - name: cargo test --release --all-features -- --ignored fuzz_deep_run
        run: cargo test --release -p tokora --all-features --lib -- --ignored --exact fuzz::tests::fuzz_deep_run

  # ── Gate: per-version logos parity ──────────────────────────────────────────
  # The crate advertises three logos majors and RUNTIME parity across them had never once been
  # executed: the `hack --each-feature` matrix clippy-checks each version but runs no tests, and
  # every test job pins the newest. Compile parity held by shared macro body, which is exactly
  # the kind of "it must be fine" that keeps turning out not to be.
  #
  # It is not fine. The first run of these cells was RED on a pre-existing dead-code failure:
  # `scan_probe`'s readers are `logos`-gated while the module was only `std`-gated,
  # so a `std, logos_0_N` test build had two unused functions and `#![deny(warnings)]` refused
  # it. No job compiles that configuration, so nothing had ever said so — the second
  # never-executed configuration found broken on arrival.
  #
  # Cost: ~11s and ~13s locally, the shape of the existing valve-off job.
  logos-versions:
    name: logos parity (0.14, 0.15)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        logos: [logos_0_14, logos_0_15]
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-logos-${{ matrix.logos }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-logos-${{ matrix.logos }}-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo test --no-default-features --features std,${{ matrix.logos }}
        run: cargo test -p tokora --no-default-features --features std,${{ matrix.logos }}

  # ── Gate: mechanical public-API diff against the last published version ─────
  # ADVISORY-RED, deliberately, and the reason is stated because "advisory" usually means
  # "ignored": both tools ride rustdoc-JSON on a pinned nightly, so a toolchain bump can redden
  # this job without the crate changing. It blocks nothing until it has a quiet week on main.
  #
  # It earns its place regardless. The recall-shaped sources a changelog is normally
  # reconstructed from — PR bodies, commit messages, surface greps — are structurally blind to
  # bound additions and to derived-`Debug` movement. In this release two of those three sources
  # turned out not to EXIST for the earliest commits (empty PR bodies, bare subject lines), and
  # this diff found two breaking changes that would otherwise have shipped undisclosed:
  # `CstEmitter::cst_finish` gaining a parameter, and `fuzz::Op` gaining a variant mid-list.
  semver-checks:
    name: semver-checks (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install cargo-semver-checks (pinned)
        run: cargo install cargo-semver-checks --locked --version 0.49.0
      - name: cargo semver-checks against the published baseline
        run: cargo semver-checks check-release -p tokora --all-features

  # ── Gate: the reference consumer, at a pinned ref ───────────────────────────
  # This was human discipline rather than infrastructure. Unautomated per-change habits stop
  # happening, so it becomes a job.
  #
  # The ref is PINNED and bumping it is a reviewed one-line change: smear's own churn must not
  # redden tokora's CI, or the job gets ignored and then deleted. It runs on schedule and on
  # demand rather than per-PR for the same reason.
  #
  # Scope worth stating, because a green result here means less than it looks: measured against
  # this release, the consumer converts tokora's error carriers structurally through `From` and
  # calls `display_fmt` zero times, so it does NOT witness render changes; its choice sites are
  # all tuple choices, so it does not witness the array-choice id change; and it implements
  # `Emitter` nowhere. What it does witness is the compile surface — the context bundles, the
  # trait members, the bound loosenings — and that is a real thing to witness.
  #
  # Requires the smear repository to be readable from this workflow. It is `workflow_dispatch`
  # + cron only until that access is granted; with a private repo it needs a token.
  smear-consumer:
    name: consumer gate (smear, pinned)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    env:
      # Reviewed one-line bump. Last verified green against this ref.
      SMEAR_REF: 4a81ab6
    steps:
      - uses: actions/checkout@v7
        with:
          path: tokit
      - name: Check out the reference consumer at its pinned ref
        run: |
          set -euo pipefail
          git clone https://github.com/al8n/smear.git smear
          cd smear && git checkout "${SMEAR_REF}"
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Point the consumer at this checkout
        run: |
          set -euo pipefail
          cd smear
          python3 - <<'PATCH'
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          s = p.read_text()
          new = 'tokora = { path = "../tokit/tokora" }'
          if "[patch.crates-io]" in s:
              s = re.sub(r'(?m)^tokora = \{ path = .*$', new, s)
          else:
              s += f"\n[patch.crates-io]\n{new}\n"
          p.write_text(s)
          PATCH
          grep -A2 'patch.crates-io' Cargo.toml
      # `[patch]` is advisory: if the patched version does not satisfy the consumer's
      # requirement, cargo WARNS and falls back to the registry — exit 0, job green,
      # having witnessed nothing about this checkout. Measured concretely once tokora
      # crossed the consumer's `tokora = "0.7.3"` ceiling (>=0.7.3, <0.8.0): `cargo test`
      # printed `patch `tokora v0.8.0 (...)` was not used in the crate graph`, resolved
      # v0.7.3 from crates.io instead, and still exited 0.
      #
      # So this asserts the fact cargo actually resolved, not cargo's wording for it — a
      # warning string is cargo's choice of phrasing and can change; the resolved graph
      # cannot lie the same way. A path dependency resolves with `"source": null`; a
      # registry crate always has one. That is `cargo metadata`'s answer, not a grep over
      # a log line that happens not to have fired this time.
      - name: Assert the patch actually applied (positive check on the resolved graph)
        run: |
          set -euo pipefail
          cd smear
          cargo metadata --format-version 1 > /tmp/smear-metadata.json
          python3 - <<'PY'
          import json, sys

          with open("/tmp/smear-metadata.json") as f:
              meta = json.load(f)

          matches = [p for p in meta["packages"] if p["name"] == "tokora"]

          if len(matches) != 1:
              sys.exit(
                  "::error::expected exactly one `tokora` package in the resolved "
                  f"graph, found {len(matches)}: the job would otherwise have tested "
                  "a published tokora rather than this checkout"
              )

          pkg = matches[0]
          if pkg["source"] is not None:
              sys.exit(
                  "::error::resolved `tokora` has a registry source "
                  f"({pkg['source']!r}), so [patch.crates-io] did not apply — the "
                  "job would otherwise have tested a published tokora rather than "
                  "this checkout"
              )

          print(
              f"patch applied: tokora {pkg['version']} resolved with source=null "
              f"(manifest: {pkg['manifest_path']})"
          )
          PY
      - name: cargo test (three-crate scope)
        run: |
          cd smear
          cargo test -p smear-lexer -p smear-scaffold -p smear-parser-next --no-fail-fast

  # ── Gate: name-collision probe ────────────────────────────────────
  # Adding a public name is not additive at the source level. Four successively more
  # precise statements of *when* a collision is loud were each falsified by a spelling
  # nobody had written down.
  #
  # So this job does not check a rule. It derives the inventory of names this branch adds,
  # then compiles one byte-identical consumer against the merge base and against the
  # branch — **against each name's real owner** — and fails only on the outcome no
  # diagnostic can report: both sides compile, neither warns, and the runtime witness
  # disagrees.
  #
  # The inventory is REQUIRED and generated, never hand-listed: the first version of this
  # job passed the base ref alone, so the script probed one hard-coded name and reported
  # green over 29 it never ran. `run.sh` now refuses to start without it.
  name-collision:
    name: name-collision-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchains
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup toolchain install nightly
      - name: Derive the added-name inventory from rustdoc JSON, both sides
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "base=$base" >> "$GITHUB_ENV"
          feat="std,logos,trace,rowan"
          mkdir -p /tmp/nc && git worktree add /tmp/nc/base "$base"
          # `Cargo.lock` is gitignored. The prior scheme generated it ONCE from head's
          # manifest and copied it into base, so `--locked` below could prove the two
          # `cargo doc` runs saw the same dependency graph — but that shared lock goes
          # unsatisfiable the moment the PR edits base's manifest at all, and a manifest
          # edit is a class, not one shape: a `[dependencies]` requirement change and a
          # bare package-`version` bump both do it, because both change what the copied
          # lock is checked against. Seen concretely on the 0.8.0 release PR (#134, zero
          # `.rs` files in the diff): the shared lock came from head's 0.8.0 manifest,
          # base was still 0.7.3, and `--locked` refused base for a version bump alone.
          #
          # So each side resolves its OWN lock from its OWN manifest — no copy, nothing to
          # go stale. Stopping there would silently give up what the shared lock existed
          # to prove, though: that neither side's name-collision finding is an artifact of
          # the two `cargo doc` runs linking different versions of some third crate. The
          # comparison below restores that guarantee explicitly instead of assuming it —
          # every `[[package]]` triple (name, version, source) must match across both
          # locks, with exactly one allowed exception: tokora's own entry, whose version is
          # the one manifest edit this job exists to permit. `--locked` stays on both
          # `cargo doc` calls so a re-resolution during doc generation is refused rather
          # than silently accepted.
          cargo generate-lockfile
          ( cd /tmp/nc/base && cargo generate-lockfile )
          python3 - <<'PY'
          import re, sys

          def parse_lock(path):
              text = open(path, encoding="utf-8").read()
              out = []
              for block in re.split(r"(?m)^\[\[package\]\]\s*$", text)[1:]:
                  stop = re.search(r"(?m)^\[", block)
                  body = block[: stop.start()] if stop else block
                  name = re.search(r'(?m)^name\s*=\s*"([^"]*)"', body)
                  version = re.search(r'(?m)^version\s*=\s*"([^"]*)"', body)
                  source = re.search(r'(?m)^source\s*=\s*"([^"]*)"', body)
                  if not name or not version:
                      sys.exit(
                          f"::error::{path}: a [[package]] block has no name/version; "
                          "the lock format has changed under this parser"
                      )
                  out.append((
                      name.group(1),
                      version.group(1),
                      source.group(1) if source else None,
                  ))
              return out

          head = parse_lock("Cargo.lock")
          base = parse_lock("/tmp/nc/base/Cargo.lock")

          if not any(n == "tokora" for n, _, _ in head):
              sys.exit("::error::Cargo.lock: no tokora [[package]] entry")
          if not any(n == "tokora" for n, _, _ in base):
              sys.exit("::error::/tmp/nc/base/Cargo.lock: no tokora [[package]] entry")

          head_set, base_set = set(head), set(base)
          only_head = {t for t in head_set - base_set if t[0] != "tokora"}
          only_base = {t for t in base_set - head_set if t[0] != "tokora"}

          if only_head or only_base:
              print("::error::lock graphs disagree beyond tokora's own version")
              for n, v, s in sorted(only_base):
                  print(f"  only in base: {n} {v} ({s or 'path/local'})")
              for n, v, s in sorted(only_head):
                  print(f"  only in head: {n} {v} ({s or 'path/local'})")
              sys.exit(1)

          print("lock parity OK: graphs agree except tokora's own version")
          PY
          for side in base head; do
            dir="/tmp/nc/base"; [ "$side" = head ] && dir="$PWD"
            ( cd "$dir" && RUSTC_BOOTSTRAP=1 \
                RUSTDOCFLAGS="-Z unstable-options --output-format json" \
                cargo doc -p tokora --no-deps --features "$feat" --locked )
            cp "$dir/target/doc/tokora.json" "/tmp/nc/$side.json"
          done
          python3 ci/name_collision/surface_diff.py \
            /tmp/nc/base.json /tmp/nc/head.json --features "$feat"
          cp /tmp/nc/surface_names.json /tmp/nc/inventory.json
      - name: Probe every added name against its real owner
        run: bash ci/name_collision/run.sh "$base" /tmp/nc/inventory.json

  # ── Gate: sanitizers ────────────────────────────────────────────────────────
  # `ci/sanitizer.sh` existed and had **no caller**: no job in this file referenced it, so it
  # had never run on any branch of this campaign. That is the same class as a configuration CI
  # compiles and never executes — one level up. Not a gate that covers nothing; a gate nothing
  # invokes.
  #
  # It does work: ASan and TSan both come back clean across the full test surface. That is the
  # argument for wiring it — a script that exists, works, and has never been invoked is the
  # cheapest coverage in the repo.
  #
  # One leg per job so an unsupported sanitizer reports as one red cell rather than aborting the
  # run. `leak` and `memory` are deliberately not in the matrix: they are unsupported on some
  # targets, and an expected-failure cell inverts silently the day support lands.
  #
  # If a leg fails at BUILD time with an ABI or interceptor mismatch, read `ci/sanitizer.sh`'s
  # header before filing it: the thread leg needs `-Zbuild-std` for an instrumented `std`, and
  # its absence produces a failure that reads like a sanitizer report.
  sanitizer:
    name: sanitizer (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-san-${{ matrix.san }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-san-${{ matrix.san }}-
      - name: Install Rust (nightly + rust-src for -Zbuild-std)
        run: |
          rustup toolchain install nightly --no-self-update --component rust-src
          rustup default nightly
      - name: ci/sanitizer.sh
        run: bash ci/sanitizer.sh x86_64-unknown-linux-gnu ${{ matrix.san }}

  # ── Gate: the cargo-hack per-feature clippy matrix (its own job) ────────────
  hack-clippy:
    name: hack clippy (each-feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-hack-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-hack-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: cargo +stable hack clippy -p tokora --each-feature --no-deps --tests -D warnings
        run: cargo +stable hack clippy -p tokora --each-feature --no-deps --tests -- -D warnings

  # ── Gate: no-std / bare-metal builds ────────────────────────────────────────
  no-std:
    name: no-std (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-nostd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nostd-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Add bare-metal target
        run: rustup target add thumbv6m-none-eabi
      - name: cargo build --no-default-features
        run: cargo build --no-default-features
      - name: cargo check --target thumbv6m-none-eabi --no-default-features
        run: cargo check --target thumbv6m-none-eabi --no-default-features
      - name: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc
        run: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc
      # From compile-only to RUNTIME. `cargo build --no-default-features` above gates a
      # production-code no_std violation, but it does not compile test targets at all, so a
      # `Vec`/`vec!` violation in a test — which is where one has actually been found — slips
      # past it, and nothing no_std-shaped had ever *executed*. These two host runs execute the
      # no_std tiers of the crate's own code (the harness links std; the crate paths under test
      # do not). The first run of the first of these was red on a dead-code warning nobody could
      # have seen, which is the whole argument for the cell.
      - name: cargo test -p tokora --no-default-features
        run: cargo test -p tokora --no-default-features
      - name: cargo test -p tokora --no-default-features --features alloc
        run: cargo test -p tokora --no-default-features --features alloc
      # The positive cell for CAS-less targets: `bstr` is the CAS-less-safe backing, pinned on the real CAS-less
      # target. The three CAS-needing backings (`bytes`, `hipstr`, `smol_bytes`) are documented
      # on their guide rows rather than pinned as expected-failures — an expected-fail cell
      # inverts silently the day upstream fixes it.
      - name: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc,bstr_1
        run: cargo check --target thumbv6m-none-eabi --no-default-features --features alloc,bstr_1

  # ── Gate: docs build with deny-warnings ─────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-doc-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps
      # The all-features step above documents every item, so a link whose TARGET is
      # feature-gated always resolves there — it can never see the bare configuration's
      # broken links. That configuration had 39 of them, and the docs had never been built
      # in it: `cargo doc --no-default-features` exited 101 with `could not document
      # tokora`. No RUSTDOCFLAGS is needed here — `[lints] workspace = true` already denies
      # `rustdoc::broken_intra_doc_links`, so the exit status is the assertion.
      #
      # Acceptance is exit 0, not a diagnostic count: rustdoc aborts early, so any fixed
      # count is a floor, and a floor cannot detect a missing member.
      - name: cargo doc --no-default-features --no-deps (bare-config link resolution)
        run: cargo doc -p tokora --no-deps --no-default-features

  # ── Gate: bench SMOKE only ──────────────────────────────────────────────────
  #
  # This compiles the benches and runs each once in test mode (`-- --test`); it is
  # NOT a timed regression gate. GitHub runners are far too noisy for the ±2%
  # regression discipline these benches are held to locally — a timing gate here
  # would flap. Regression numbers are gathered on dedicated hardware, off-CI.
  bench-smoke:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo bench --bench input_scan --features logos -- --test
        run: cargo bench --bench input_scan --features logos -- --test

  # ── Preserved: cross-compile smoke across extra platforms ───────────────────
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }}

  # ── Preserved: Miri (Tree Borrows) ──────────────────────────────────────────
  miri-tb:
    name: miri-tb-${{ matrix.target }}-${{ matrix.cfg }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        cfg:
          - all_tests
        exclude:
          - os: ubuntu-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: i686-unknown-linux-gnu
          - os: macos-latest
            target: powerpc64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Miri
        run: |
          bash ci/miri_tb.sh ${{ matrix.target }} ${{ matrix.cfg }}

  # ── Preserved: Miri (Stacked Borrows) ───────────────────────────────────────
  miri-sb:
    name: miri-sb-${{ matrix.target }}-${{ matrix.cfg }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        cfg:
          - all_tests
        exclude:
          - os: ubuntu-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: i686-unknown-linux-gnu
          - os: macos-latest
            target: powerpc64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-
      - name: Install cargo-hack
        run: cargo install cargo-hack
      - name: Miri
        run: |
          bash ci/miri_sb.sh ${{ matrix.target }} ${{ matrix.cfg }}

  # ── Preserved: coverage (gated on the fast gates passing) ───────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - test
      - cross
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly && rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-
      - name: Generate coverage with llvm-cov
        run: cargo llvm-cov --all-features --workspace --doctests --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: lcov.info
          fail_ci_if_error: true
